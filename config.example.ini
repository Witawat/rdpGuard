; RDPGuard - config ตัวอย่าง (คัดลอกเป็น config.ini เองก็ได้ แต่โปรแกรมสร้างให้อัตโนมัติตอนรันครั้งแรก)
; ตำแหน่งจริง: %ProgramData%\RDPGuard\config.ini (หรือ ~\.rdpguard ถ้าไม่มีสิทธิ์เขียน ProgramData)

[general]
; ระดับ log: DEBUG / INFO / WARNING / ERROR
log_level = INFO
; ขนาดไฟล์ log สูงสุดต่อไฟล์ (MB)
log_max_mb = 5
; จำนวนไฟล์ log สำรอง (0 = ไม่เก็บไฟล์เก่า)
log_backups = 5
; retention ข้อมูล (0 = ไม่ลบอัตโนมัติ)
event_retention_days = 90
history_retention_days = 365
audit_retention_days = 365

[monitor]
; เปิด/ปิดการเฝ้าระวังทั้งหมด
enable = true
; อ่าน Security event log ทุกกี่วินาที
poll_interval_seconds = 2
; ชนิด LogonType ที่นับเป็น "พยายามล็อกอิน RDP" (3=Network/NLA, 10=RemoteInteractive)
; ใช้ * เพื่อนับทุกชนิด
logon_types = 3,10

[detection]
; เจอล็อกอินผิดกี่ครั้ง (ภายใน window_minutes) ถึงจะบล็อก IP
max_attempts = 5
; กรอบเวลานับจำนวนครั้ง (นาที)
window_minutes = 10
; บล็อกนานเท่าไร (ชั่วโมง) - 0 = บล็อกถาวร
block_hours = 24
; ถ้า IP ที่ถูกบล็อกยังพยายามโจมตีต่อ ให้ต่ออายุการบล็อกอัตโนมัติ
auto_extend = true
; ข้าม IP ในวง LAN/loopback/เครื่องตัวเอง (กันบล็อกผู้ดูแลเอง)
skip_local_ips = true
; กันบล็อก IP ที่ล็อกอินสำเร็จภายในกี่นาทีที่ผ่านมา (ป้องกันบล็อกผู้ดูแลที่กำลังต่อ RDP อยู่) — 0 = ปิด
active_session_grace_minutes = 30
; รายการ IP/CIDR ที่ห้ามบล็อกเด็ดขาด (คั่น ,) — เหมือน whitelist แต่แก้ใน config ตรง ๆ ได้เมื่อฉุกเฉิน
never_block_ips =
; --- ขยายบล็อก IP ขาประจำ (repeat offender) ---
; โดนบล็อกครบกี่ครั้ง (ภายใน escalation_window_days) ถึงขยายบล็อก (0 = ปิด)
escalate_after_blocks = 3
; ขยายเป็นกี่ชั่วโมง (ค่าเริ่มต้น 7 วัน = 168)
escalate_block_hours = 168
; ขยายเป็นบล็อกถาวรเลย (แทน escalate_block_hours) — ต้องปลดด้วยมือ
escalate_to_permanent = false
; กรอบเวลานับจำนวนครั้งที่โดนบล็อก (วัน)
escalation_window_days = 30
; --- ตัวนับสะสม ---
accumulate_window_hours = 24
accumulate_threshold = 8
accumulate_block_hours = 6

[engines]
; Engine เพิ่มเติม (RDP/Security เปิดถาวร) — เปิด/ปิดแต่ละตัวได้
; openssh = อ่าน OpenSSH/Operational (Event 4) · mssql = MSSQL 18456
; iis = IIS W3C (HTTP Web Login/RD Web forms) · mysql = MySQL error log
; generic = ไฟล์ log ใด ๆ ตาม generic_logs
openssh = true
mssql = true
iis = true
mysql = true
generic = true
; ขีดจำกัดเฉพาะ engine (ว่าง = ใช้ค่ากลาง max_attempts)
openssh_max_attempts =
mssql_max_attempts =
iis_max_attempts =
mysql_max_attempts =
generic_max_attempts =
; IIS W3C log (ว่าง = auto: C:\inetpub\logs\LogFiles)
iis_log_dir =
; MySQL error log (ว่าง = auto: C:\ProgramData\MySQL\*\Data\*.err)
mysql_log_dir =
; Generic: ชื่อ=path|regex คั่นด้วย ; — ใช้ {IP} แทนตำแหน่ง IP
; เช่น: mail=C:\MailServer\log.txt|Failed login from '{IP}'
generic_logs =

[firewall]
; คำนำหน้าชื่อ rule ใน Windows Firewall (เห็นใน wf.msc)
rule_prefix = RDPGuard Block
; profile: any / domain / private / public
profile = any
; จำกัดพอร์ตที่บล็อก (ว่าง = บล็อกทุกพอร์ตจาก IP นั้น) เช่น 3389,1433,22
blocked_ports =
; โหมด rule เดียวแบบ RDPGuard: rule เดียว (ชื่อ rule_prefix) แล้วเพิ่ม/ลบ IP ในรายการ
; RemoteAddresses ตาม IP ที่โจมตี — false = สร้าง rule แยกต่อ IP
single_rule = true

[webui]
; Web UI: 127.0.0.1 = เฉพาะเครื่องนี้ (ค่าเริ่มต้น ปลอดภัยสุด)
; 0.0.0.0 = เข้าจากเครื่องอื่นใน LAN ได้ (ต้องตั้ง password และเปิดพอร์ต firewall เอง)
host = 127.0.0.1
port = 8123
; รหัสผ่านหน้า Web UI (ว่าง = สุ่มให้อัตโนมัติตอนรันครั้งแรก)
password =

[notify]
; เปิดแจ้งเตือนเมื่อบล็อก IP
enable = false
; both / telegram / email
channel = both
; ชื่อเครื่องแสดงในข้อความ Telegram (ว่าง = ชื่อเครื่องระบบ) — ใช้สั่งเป้า @ชื่อเครื่อง
; ห้ามมีช่องว่าง/@ — ใช้ตัวอักษร ตัวเลข - หรือ _
hostname =
telegram_bot_token =
telegram_chat_id =
; ปิดเมื่อ proxy/โปรแกรมกันไวรัส intercept HTTPS แล้วเกิด CERTIFICATE_VERIFY_FAILED
telegram_verify_ssl = true
smtp_host =
smtp_port = 587
smtp_user =
smtp_password =
smtp_to =
cooldown_seconds = 60
; Webhook เสริม
webhook_enable = false
webhook_url =
webhook_verify_ssl = true
